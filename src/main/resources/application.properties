spring.application.name=project-manager
server.port=8080

# SQLite file location; override with DB_PATH (e.g. /data/project-manager.db in Docker)
spring.datasource.url=jdbc:sqlite:${DB_PATH:project-manager.db}?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer; one pooled connection avoids SQLITE_BUSY errors
spring.datasource.hikari.maximum-pool-size=1

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
