# CI = "continuous integration": GitHub automatically builds the app and runs
# its tests whenever code changes, so problems are caught before they're merged.
name: CI

# When this runs: every push to main, and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# What this workflow is allowed to do in the repo (as little as possible).
permissions:
  contents: read # read the code
  checks: write # post the test results as a "check" on the commit / PR

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # reuse downloaded libraries between runs

      - name: Build the app and run all tests
        run: ./mvnw -B verify

      - name: Save the raw test reports (downloadable from the run page)
        if: ${{ !cancelled() }} # also when tests fail, that's when they're most useful
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/*.xml

      - name: Show test results in GitHub
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

  docker:
    name: Check the Docker image builds
    needs: test # only runs if the tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build the Docker image (not published anywhere)
        run: docker build -t project-manager:ci .
