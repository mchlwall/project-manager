# CI = "continuous integration": GitHub automatically builds the app and runs
# its tests whenever code changes, so problems are caught before they're merged.
name: CI

# When this runs: every push to main, and every pull request.
on:
  push:
    branches: [main]
  pull_request:

# What this workflow is allowed to do in the repo (as little as possible).
permissions:
  contents: read # read the code
  checks: write # post the test results as a "check" on the commit / PR

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # reuse downloaded libraries between runs

      - name: Build the app and run all tests
        run: ./mvnw -B verify

      - name: Save the raw test reports (downloadable from the run page)
        if: ${{ !cancelled() }} # also when tests fail, that's when they're most useful
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/*.xml

      - name: Show test results in GitHub
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

  api-tests:
    name: Run API tests against the running app
    needs: test
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8080 # where the API tests send their requests
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start the app and wait for health check
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: Run the API tests and check their formatting
        run: ./mvnw -B -f api-tests/pom.xml verify

      - name: Show the app's logs (only if something failed)
        if: ${{ failure() }}
        run: docker compose logs

      - name: Build the Allure report (a single HTML file)
        if: ${{ !cancelled() }}
        run: ./mvnw -B -f api-tests/pom.xml allure:report

      - name: Save the Allure report and raw results (downloadable from the run page)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api-tests/target/site/allure-maven-plugin/
            api-tests/target/allure-results/
            api-tests/target/surefire-reports/*.xml

      - name: Show API test results in GitHub
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: API Tests
          path: api-tests/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Package the Allure report for GitHub Pages (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: api-tests/target/site/allure-maven-plugin/

  publish-api-test-report:
    name: Publish the API test report to GitHub Pages
    needs: api-tests
    # Only for main, and also when tests failed (that's when the report is most useful)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.api-tests.result == 'success' || needs.api-tests.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # prove to Pages that this workflow is allowed to publish
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish the report
        id: deploy
        uses: actions/deploy-pages@v5

  docker:
    name: Check the Docker image builds
    needs: test # only runs if the tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build the Docker image (not published anywhere)
        run: docker build -t project-manager:ci .
