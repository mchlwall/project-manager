# CI = "continuous integration": GitHub automatically builds the app and runs
# its tests whenever code changes, so problems are caught before they're merged.
name: CI

# When this runs: every push to main, every pull request, and nightly.
# The nightly run is what makes alerting useful: nobody is watching it, so a
# failure there opens a GitHub issue (see the last step of the e2e-tests job).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual "Run workflow" button / `gh workflow run CI`
    inputs:
      force_fail: # TEMPORARY: remove after verifying the alert
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * 1,3,5" # 09:00 UTC Mon, Wed & Fri

# What this workflow is allowed to do in the repo (as little as possible).
permissions:
  contents: read # read the code
  checks: write # post the test results as a "check" on the commit / PR

# If you push again while a run is still going, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven # reuse downloaded libraries between runs

      - name: Build the app and run all tests
        run: ./mvnw -B verify

      - name: Save the raw test reports (downloadable from the run page)
        if: ${{ !cancelled() }} # also when tests fail, that's when they're most useful
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: target/surefire-reports/*.xml

      - name: Show test results in GitHub
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

  api-tests:
    name: Run API tests against the running app
    needs: test
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://localhost:8080 # where the API tests send their requests
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start the app and wait for health check
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: Run the API tests and check their formatting
        run: ./mvnw -B -f api-tests/pom.xml verify

      - name: Show the app's logs (only if something failed)
        if: ${{ failure() }}
        run: docker compose logs

      - name: Build the Allure report (a single HTML file)
        if: ${{ !cancelled() }}
        run: ./mvnw -B -f api-tests/pom.xml allure:report

      - name: Save the Allure report and raw results (downloadable from the run page)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api-tests/target/site/allure-maven-plugin/
            api-tests/target/allure-results/
            api-tests/target/surefire-reports/*.xml

      - name: Show API test results in GitHub
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: API Tests
          path: api-tests/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Package the Allure report for GitHub Pages (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: api-tests/target/site/allure-maven-plugin/

  publish-api-test-report:
    name: Publish the API test report to GitHub Pages
    needs: api-tests
    # Only for main, and also when tests failed (that's when the report is most useful)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.api-tests.result == 'success' || needs.api-tests.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # prove to Pages that this workflow is allowed to publish
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish the report
        id: deploy
        uses: actions/deploy-pages@v5

  e2e-tests:
    name: Run E2E tests against the running app
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    defaults:
      run:
        working-directory: e2e # the Playwright tests live in their own folder
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm # reuse downloaded packages between runs
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        run: npm ci

      - name: Install the Chromium browser
        run: npx playwright install --with-deps chromium

      # Playwright starts the app itself in Docker (see webServer in playwright.config.ts)
      - name: Run the E2E tests
        run: npx playwright test

      - name: TEMPORARY - force a failure to test the alert
        if: ${{ inputs.force_fail }}
        run: |
          echo "Forcing failure to test alerting"
          exit 1

      - name: Save the Playwright report (downloadable from the run page)
        id: upload-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Show E2E test results in GitHub
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: E2E Tests
          path: e2e/junit-results/junit.xml
          reporter: java-junit

      # Alert: on cron & open an issue. If one is already open, comment on it instead
      # so a failure that persists for days doesn't create a pile of issues.
      - name: Open a GitHub issue about the failure
        if: ${{ failure() && github.event_name != 'pull_request' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
          TRIGGER: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          body="E2E tests failed (trigger: \`$TRIGGER\`, commit: \`${SHA:0:7}\`).

          - Run: $RUN_URL
          - Playwright report (download, then \`npx playwright show-report\`): ${REPORT_URL:-see the run page}"

          gh label create e2e-failure --color B60205 \
            --description "Scheduled or main-branch E2E failure" 2>/dev/null || true

          existing=$(gh issue list --label e2e-failure --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label e2e-failure \
              --title "E2E tests failing on $(date -u +%F)" --body "$body"
          fi
  
  docker:
    name: Check the Docker image builds
    needs: test # only runs if the tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Build the Docker image (not published anywhere)
        run: docker build -t project-manager:ci .
